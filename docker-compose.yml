version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=EventSphere
      - ENVIRONMENT=development
      - SECRET_KEY=eventsphere-ultra-secure-key-for-local-docker
      - DATABASE_URL=sqlite:///./eventsphere.db
      - CART_HOLD_DURATION_SECONDS=300
      - WAITLIST_HOLD_DURATION_SECONDS=300
      - WAITLIST_SWEEP_INTERVAL_SECONDS=10
      - VENUE_TURNAROUND_BUFFER_MINUTES=60
    volumes:
      - .:/app
    restart: unless-stopped
